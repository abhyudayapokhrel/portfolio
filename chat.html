<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="css/tokens.css"><link rel="stylesheet" href="css/main.css"><title>chat</title></head><body class="desk-theme" data-title="chat"><main><div class="col">
<img class="mascot" src="assets/mascot.svg" alt="">
<p class="eyebrow">ask me stuff</p><h1>talk to my tiny agent</h1>
<p class="sub">it knows my notes and not much else. ask about what i wrote, what i listen to, or why the site is gray.</p>
<div class="status"><i></i>online</div>
<div class="msgs" id="m" aria-live="polite"></div>
<form class="chatbox" id="f"><textarea id="q" placeholder="say something..." aria-label="message"></textarea><button class="send" aria-label="send">↑</button></form>
<div class="chips"><button class="chip">what are you writing lately?</button><button class="chip">show me the graph</button><button class="chip">what do you listen to?</button><button class="chip">why so gray?</button><button class="chip">any good films?</button></div>
<p class="disc">this is a demo stub. replies are canned. hook it up to an api in js/chat.js to make it real.</p></div></main>
<script src="js/notes.js"></script><script src="js/shell.js"></script><script src="js/chat.js"></script></body></html>
